<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zuhause">
<meta name="theme-color" content="#1e1f24">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Davids Zuhause</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone-first dark home app — centered page header, room sections with icon tiles + stat pills, bottom tab bar; wide screens put sections into columns. Dark-only by choice. */
:root{
  --bg:#141518; --bar:#1e1f24; --card:#24252b; --card-2:#2d2e35; --line:#34353d;
  --fg:#f5f5f7; --muted:#8d8e96; --dim:#5f6068;
  --blue:#3d8bff; --orange:#ff9f0a; --green:#7ccf3a; --yellow:#ffc53d; --red:#ff5a5f; --teal:#38d1c0;
  --on-bg:#f2f2f5; --on-fg:#16171b;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Roboto","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg);overflow-x:hidden;max-width:100%}
body{font-family:var(--font);font-size:15px;line-height:1.35;font-variant-numeric:tabular-nums;transition:filter .6s}
body.night{filter:brightness(.6) saturate(.8)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--bar)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}

/* top header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));background:var(--bar);border-radius:0 0 50% 50% / 0 0 26px 26px;padding:12px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.top h1{margin:0;text-align:center;font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.top h1 svg{color:var(--accent,var(--blue))}
.round{width:40px;height:40px;border-radius:50%;border:0;background:var(--card-2);display:grid;place-items:center;color:var(--fg)}
.round[aria-pressed="true"]{color:var(--yellow)}
.conn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:0;background:var(--card-2);font-size:13px;color:var(--muted);white-space:nowrap}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.conn.live i{background:var(--green)}
.conn.err i{background:var(--red)}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:-22px;position:relative;z-index:9;text-align:center}
.hero .tile{width:76px;height:76px;border-radius:20px;background:var(--card-2);display:grid;place-items:center;color:var(--fg);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.hero h2{margin:6px 0 0;font-size:36px;font-weight:700;letter-spacing:-.02em}
.hero .stats{display:flex;gap:18px;color:var(--muted);font-size:17px;flex-wrap:wrap;justify-content:center}
.hero .stats span{display:inline-flex;align-items:center;gap:5px}

/* sections */
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:8px 22px;margin-top:22px}
@media (min-width:820px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1150px){.cols.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cols>div{min-width:0}
.sec{min-width:0;display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.sh{display:flex;align-items:center;gap:12px;min-width:0;border:0;background:none;padding:0;text-align:left;width:100%}
.sh .si{width:38px;height:38px;border-radius:10px;background:var(--card-2);display:grid;place-items:center;flex:none;color:var(--fg)}
.sh h3{margin:0;font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sh .chev{color:var(--muted);flex:none}
.pill{margin-left:auto;display:inline-flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:6px 12px;font-size:15px;white-space:nowrap;flex:none}
.pill span{display:inline-flex;align-items:center;gap:4px}
.pill svg{color:var(--muted)}
.title{font-size:24px;font-weight:700;margin:6px 0 2px}

/* cards */
.card{background:var(--card);border-radius:18px;padding:16px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;min-width:0}
.grow{flex:1;min-width:0}
.name{font-size:17px;overflow-wrap:anywhere}
.sub{font-size:14px;color:var(--muted)}
.red{color:var(--red)!important}

/* thermostat row */
.thermo{display:grid;grid-template-columns:minmax(0,1fr) 70px;background:var(--card);border-radius:18px;overflow:hidden;min-height:100px}
.thermo .main{display:flex;align-items:center;gap:16px;padding:14px 16px;min-width:0}
.thermo .ctl{display:grid;grid-template-rows:1fr 1fr;border-left:1px solid var(--line)}
.thermo .ctl button{border:0;background:none;color:var(--fg);display:grid;place-items:center}
.thermo .ctl button+button{border-top:1px solid var(--line)}
.thermo .ctl button:active{background:var(--card-2)}
.thermo .ctl button:disabled{color:var(--dim);cursor:default}
.temps{display:flex;align-items:baseline;gap:8px;font-size:30px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.temps .cur{color:var(--muted)}
.temps .arr{font-size:18px;color:var(--muted)}
.dev-ic{position:relative;flex:none;color:var(--fg)}
.dev-ic .badge{position:absolute;right:-6px;bottom:-4px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--muted);color:var(--card);border:2px solid var(--card)}
.dev-ic .badge.heat{background:var(--orange)}

/* device tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tile{position:relative;aspect-ratio:1/1;max-width:100%;border:0;border-radius:18px;background:var(--card);padding:12px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;min-width:0;transition:background .2s,color .2s}
.tile .ti{color:var(--fg);display:flex;justify-content:space-between;align-items:flex-start}
.tile b{font-weight:500;font-size:14px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.on{background:var(--on-bg);color:var(--on-fg)}
.tile.on .ti{color:var(--on-fg)}
.tile.on small{color:#5c5d66}
.tile.on .lamp-glow{color:#e7a500}
.tile.off-line{opacity:.5}
.tile .dot{width:10px;height:10px;border-radius:50%;background:var(--red)}
.tile.static{cursor:default}

/* scenes */
.scenes{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scene{flex:none;display:flex;align-items:center;gap:10px;border:0;background:var(--card);border-radius:14px;padding:12px 16px;font-weight:600;font-size:15px}
.scene .sc{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.scene:active{transform:scale(.97)}

/* alerts / lists */
.alert{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;width:100%;text-align:left}
.alert+.alert{border-top:1px solid var(--line)}
.alert .ai{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ai.r{background:rgba(255,90,95,.15);color:var(--red)}
.ai.y{background:rgba(255,197,61,.15);color:var(--yellow)}
.alert .tag{font-size:13px;color:var(--muted);white-space:nowrap;margin-left:auto;padding-left:8px}

/* weather */
.wx{display:flex;align-items:center;gap:14px}
.wx b{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1}
.wxrow{display:grid;grid-template-columns:repeat(6,1fr);text-align:center;font-size:13px;color:var(--muted);margin-top:14px}
.wxrow b{display:block;color:var(--fg);font-weight:600;font-size:15px}

/* energy */
.kpis{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.kpi{display:flex;flex-direction:column}
.kpi b{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.kpi b small{font-size:15px;font-weight:600;margin-left:3px}
.kpi span{font-size:15px;color:var(--muted)}
.vsep{width:1px;align-self:stretch;background:var(--line)}
.chart{width:100%;height:auto;display:block;margin-top:14px}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.rank{display:flex;align-items:center;gap:16px;padding:14px 16px}
.rank+.rank{border-top:1px solid var(--line)}
.rank .ri{position:relative;flex:none;color:var(--fg)}
.rank .num{position:absolute;right:-8px;bottom:-6px;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;border:2px solid var(--card)}
.rank .bar{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--green);border-radius:2px}
.balance{height:8px;border-radius:4px;background:var(--card-2);display:flex;overflow:hidden;margin-top:14px}
.balance i{display:block;height:100%}

/* media */
.np{display:flex;gap:14px;align-items:center}
.art{width:64px;height:64px;border-radius:14px;flex:none;background:linear-gradient(135deg,#5b5cf0,#3d8bff 50%,#38d1c0)}
.ctrl{display:flex;justify-content:center;align-items:center;gap:30px;margin-top:14px}
.ctrl button{border:0;background:none;color:var(--fg);display:grid;place-items:center;width:44px;height:44px}
.ctrl .play{width:54px;height:54px;border-radius:50%;background:var(--fg);color:var(--bg)}
.vol{display:flex;align-items:center;gap:12px;color:var(--muted);margin-top:12px}
input[type=range]{flex:1;accent-color:var(--blue);min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:0;background:var(--card-2);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip:disabled{opacity:.4;cursor:not-allowed}

/* vacuum */
.vbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.vbtns button{border:0;background:var(--card-2);border-radius:14px;padding:12px 6px;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px}
.vbtns .primary{background:var(--blue);color:#fff}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);border-top:1px solid #2a2b31;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs div{display:flex;max-width:640px;margin:0 auto}
nav.tabs button{flex:1 1 0;min-width:0;border:0;background:none;color:#a3a4ab;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;font-size:12px}
nav.tabs button[aria-current="page"]{color:var(--blue)}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:grid;place-items:end center}
.dlg{background:var(--bar);border-radius:22px 22px 0 0;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));width:min(560px,100%);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{place-items:center;padding:20px}.dlg{border-radius:22px}}
.dlg h3{margin:0;font-size:20px}
.dlg p{margin:0;color:var(--muted);font-size:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13px;font-weight:600;color:var(--muted)}
.fld input{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;width:100%}
.fld input:focus{outline:2px solid var(--blue);outline-offset:0}
.fld small{color:var(--dim);font-size:12px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:12px}
.trow input{width:22px;height:22px;accent-color:var(--blue)}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:0;background:var(--card-2);border-radius:12px;padding:12px 16px;font-weight:600}
.btn.primary{background:var(--blue);color:#fff}
.msg{font-size:14px;padding:10px 12px;border-radius:12px}
.msg.err{background:rgba(255,90,95,.14);color:#ffb3b5}
.msg.ok{background:rgba(124,207,58,.14);color:#c4ec9f}
.note{color:var(--dim);font-size:13px;margin:6px 2px}
.toast{position:fixed;left:50%;transform:translate(-50%,8px);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <button class="conn" id="conn" data-open="settings"><i></i><span>Demo</span></button>
    <h1 id="vt"></h1>
    <button class="round" id="nightbtn" aria-pressed="false" aria-label="Nachtmodus"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Bereiche"><div>
  <button data-view="home" aria-current="page"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2l9 7.3V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>Startseite</button>
  <button data-view="rooms"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2.2"/><rect x="13" y="3" width="8" height="8" rx="2.2"/><rect x="3" y="13" width="8" height="8" rx="2.2"/><rect x="13" y="13" width="8" height="8" rx="2.2"/></svg>Räume</button>
  <button data-view="climate"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/></svg>Klima</button>
  <button data-view="energy"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5C11 3.5 4.5 8 4.5 15.5c0 1.3.2 2.5.6 3.6L3 21.2l1.4 1.4 2.1-2.1c1.1.4 2.3.6 3.6.6C17 21.1 20.5 14 20.5 3.5zM8 18.5c2-4 5-7 9-9-3 3-5.5 6-7.5 9.6z"/></svg>Energie</button>
  <button data-open="settings"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>Mehr</button>
</div></nav>
<div id="modal"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const P={
lamp:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',
socket:'<path d="M8 3h8a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/><circle cx="12" cy="12" r="3.5"/><path d="M11 11.2v1.6M13 11.2v1.6"/>',

batt:'<rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2M6 11v2"/>',

bed:'<path d="M3 18v-7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7M3 15h18M6 9V6h5v3M13 9V6h5v3M3 18v2M21 18v2"/>',
bath:'<path d="M4 12h16v3a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM6 12V5a2 2 0 0 1 4 0M7 19l-1 2M17 19l1 2"/>',

play:'<path d="M7 4v16l13-8z" fill="currentColor" stroke="none"/>',

dock:'<path d="M3 11l9-7 9 7M5 10v10h14V10"/>',

function baseUrl(a){a=(a||"").trim().replace(/\/+$/,"");if(!a)return"";if(/^https?:\/\//.test(a))return a;
  if(/^\d+\.\d+\.\d+\.\d+$/.test(a))return`https://${a.replace(/\./g,"-")}.homey.homeylocal.com`;return"https://"+a}
async function api(path,opt={}){
  const r=await fetch(baseUrl(cfg.addr)+path,{...opt,headers:{"Authorization":"Bearer "+cfg.key,"Content-Type":"application/json"}});
  if(r.status===401||r.status===403)throw new Error("API-Schlüssel abgelehnt (fehlende Rechte?)");
  if(!r.ok)throw new Error("Homey antwortet mit Fehler "+r.status);
  const t=await r.text();return t?JSON.parse(t):null;
}
const CLS={light:"lamp",socket:"socket",thermostat:"thermostat",heater:"thermostat",vacuumcleaner:"vacuum",speaker:"speaker",tv:"speaker",camera:"camera",sensor:"sensor",solarpanel:"solar",battery:"solar",airpurifier:"air",airconditioning:"air",fan:"air",dehumidifier:"air",humidifier:"air",button:"button",remote:"button",other:"router"};
function mapDevice(d,zones){
  const c=d.capabilitiesObj||{},v=k=>c[k]?c[k].value:undefined;
  const t=CLS[d.virtualClass||d.class]||"router";
  const o={id:d.id,n:d.name,z:(zones[d.zone]&&zones[d.zone].name)||"Ohne Raum",t,caps:c,live:true};
  if(v("onoff")!==undefined)o.on=!!v("onoff");
  const w=v("measure_power");if(w!=null)o.w=Math.round(w);else if('on' in o)o.w=0;
  if(v("target_temperature")!=null)o.temp=v("target_temperature");
  if(v("measure_temperature")!=null)o.cur=v("measure_temperature");
  if(v("measure_humidity")!=null)o.hum=Math.round(v("measure_humidity"));
  if(v("measure_battery")!=null)o.batt=Math.round(v("measure_battery"));
  if(v("measure_pm25")!=null)o.pm=Math.round(v("measure_pm25"));
  if(v("vacuumcleaner_state")!=null)o.vstate=v("vacuumcleaner_state");
  if(v("speaker_playing")!=null)o.playing=!!v("speaker_playing");
  if(v("volume_set")!=null)o.vol=Math.round(v("volume_set")*100);
  if(v("speaker_track")!=null)o.track=v("speaker_track");
  if(v("speaker_artist")!=null)o.artist=v("speaker_artist");
  if(t==="solar")o.gen=true;
  if(d.available===false)o.warn=d.unavailableMessage||"Nicht erreichbar";
  else if(v("alarm_battery")===true&&o.batt==null)o.warn="Batterie schwach";
  o.base=o.w||6;return o;
}
async function connect(silent){
  if(!cfg.addr||!cfg.key){loadDemo();render();return}
  if(sandboxed){S.mode="demo";S.err="In dieser Vorschau sind Verbindungen gesperrt. Öffne die App über GitHub im Heimnetz.";render();return}
  try{
    const [devs,zones]=await Promise.all([api("/api/manager/devices/device/"),api("/api/manager/zones/zone/")]);
    S.devices=Object.values(devs).map(d=>mapDevice(d,zones));
    S.mode="live";S.err="";
    api("/api/manager/users/user/").then(u=>{S.users=Object.values(u).map(x=>({name:x.name,present:x.present,asleep:x.asleep}));render()}).catch(()=>{});
    Promise.all([api("/api/manager/flow/flow/").catch(()=>({})),api("/api/manager/flow/advancedflow/").catch(()=>({}))])
      .then(([a,b])=>{S.flows=[...Object.values(a).map(f=>({id:f.id,name:f.name,adv:false})),...Object.values(b).map(f=>({id:f.id,name:f.name,adv:true}))]});
    if(!S.histLive){S.solarHist=Array(24).fill(0);S.histLive=true}
    const now=new Date().getHours();S.solarHist[now]=Math.max(S.solarHist[now],solarNow());
    if(!silent)toast("Mit Homey verbunden");
  }catch(e){
    S.err=e.name==="TypeError"?"Homey nicht erreichbar. Bist du im Heimnetz und stimmt die Adresse?":e.message;
    if(!S.devices.length||!S.devices[0].live)loadDemo();S.mode="error";
  }
  render();
}
async function setCap(d,cap,value,revert){
  if(S.mode!=="live")return true;
  try{await api(`/api/manager/devices/device/${d.id}/capability/${cap}`,{method:"PUT",body:JSON.stringify({value})});return true}
  catch(e){revert&&revert();toast("Fehler: "+e.message);render();return false}
}
async function triggerFlow(name){
  const f=S.flows.find(x=>x.name.trim().toLowerCase()===name.toLowerCase());
  if(!f){toast(`Lege in Homey einen Flow „${name}“ an`);return false}
  try{await api(`/api/manager/flow/${f.adv?"advancedflow":"flow"}/${f.id}/trigger`,{method:"POST",body:"{}"});toast(`„${name}“ gestartet`);setTimeout(()=>connect(true),1500);return true}
  catch(e){toast("Fehler: "+e.message);return false}
}

function presenceCard(){
  const st=u=>u.asleep?["Schläft","var(--teal)"]:u.present?["Zuhause","var(--green)"]:["Unterwegs","var(--muted)"];
  return`<section class="sec"><div class="title">Anwesenheit</div><div class="card flush">${S.users.map(u=>{const [t,c]=st(u);
    return`<div class="alert"><span class="ai" style="background:var(--card-2);border-radius:50%;font-weight:700">${esc((u.name||"?")[0])}</span><span class="grow name">${esc(u.name)}</span><span class="tag" style="color:${c}">${t}</span></div>`}).join("")}</div></section>`;
}
function areaChart(){
  const W=340,H=180,l=36,b=24,t=8,max=Math.max(150,...S.solarHist),top=Math.ceil(max/150)*150,x=i=>l+i*(W-l-6)/23,y=v=>H-b-(v/top)*(H-b-t);
  const line=S.solarHist.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  const grid=[0,1,2,3].map(k=>{const v=top/3*k;return`<line x1="${l}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#34353d"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`}).join("");
  const xl=[0,6,12,18,23].map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${i===23?"24:00":i+":00"}</text>`).join("");
  const now=new Date().getHours();
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Solarleistung über den Tag in Watt"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d8bff" stop-opacity=".55"/><stop offset="1" stop-color="#3d8bff" stop-opacity=".05"/></linearGradient></defs>
   ${grid}<path d="${line} L${x(23)} ${y(0)} L${x(0)} ${y(0)}Z" fill="url(#sg)"/><path d="${line}" fill="none" stroke="#3d8bff" stroke-width="2"/><path d="${line}" fill="none" stroke="#ff9f0a" stroke-width="1" opacity=".7"/>
   <circle cx="${x(now)}" cy="${y(S.solarHist[now])}" r="4" fill="#ff9f0a" stroke="#24252b" stroke-width="2"/>${xl}</svg>`;
}

const V={
 home:()=>{
   let favs=["Strom Fernseher","Ikea Lampe","LED Flur","Lampe Büro","Levoit","Luftentfeuchter"].map(n=>S.devices.find(d=>d.n===n)).filter(Boolean);
   if(!favs.length)favs=S.devices.filter(d=>'on' in d).slice(0,6);
   return`${hero("Heim")}<div style="margin-top:22px">${scenesBlock()}</div>
   <div class="cols three">
    <div>${alertsCard()}<section class="sec"><div class="title">Favoriten</div><div class="tiles">${favs.map(tile).join("")}</div></section>${energyMini()}</div>
    <div>${weatherCard()}${mediaCard()}</div>
    <div>${vacuumCard()}${presenceCard()}</div>
   </div>`},
 rooms:()=>`${hero("Räume","home")}<div class="cols">${zones().map(z=>`<section class="sec" id="${slug(z)}">${secHead(z,false)}<div class="tiles">${S.devices.filter(d=>d.z===z).map(tile).join("")}</div></section>`).join("")}</div>`,
 climate:()=>{const zs=zones().filter(z=>S.devices.some(d=>d.z===z&&(d.t==="thermostat"||d.t==="air")));
   return`${hero("Heim")}<div class="cols">${zs.map(z=>{const ds=S.devices.filter(d=>d.z===z);
     return`<section class="sec">${secHead(z)}${ds.filter(d=>d.t==="thermostat").map(thermoRow).join("")}${ds.filter(d=>d.t==="air").map(onoffRow).join("")}</section>`}).join("")}</div>`},
 energy:()=>{
   const sol=solarNow(),u=useNow(),kwh=(S.solarHist.reduce((a,b)=>a+b,0)/1000).toFixed(1).replace(".",",");
   const users=S.devices.filter(d=>d.on&&d.w>0&&!d.gen).sort((a,b)=>b.w-a.w),mx=Math.max(1,...users.map(d=>d.w));
   return`<div style="height:8px"></div><div class="cols">
    <div><section class="sec"><div class="title">Strom</div><div class="card">
     <div class="kpis"><span style="color:var(--blue)">${ic("bolt",30)}</span><div class="kpi"><b style="color:var(--blue)">${u}<small>W</small></b><span>Verbrauch jetzt</span></div><span class="vsep"></span><div class="kpi"><b style="color:${sol>=u?"var(--green)":"var(--red)"}">${Math.abs(sol-u)}<small>W</small></b><span>${sol>=u?"Überschuss":"Netzbezug"}</span></div></div>
     ${balanceBar(sol,u)}</div></section>
    <section class="sec"><div class="title">Solar</div><div class="card">
     <div class="kpis"><span style="color:var(--yellow)">${ic("sun",30)}</span><div class="kpi"><b style="color:var(--orange)">${kwh}<small>kWh</small></b><span>Erzeugt heute</span></div><span class="vsep"></span><div class="kpi"><b style="color:var(--blue)">${sol}<small>W</small></b><span>Jetzt</span></div></div>${areaChart()}</div></section></div>
    <div><section class="sec"><div class="title">Spitzenverbraucher</div><div class="card flush">${users.slice(0,8).map((d,i)=>`<div class="rank"><span class="ri">${ic(devIcon(d.t),36,1.6)}<span class="num">${i+1}</span></span><div class="grow"><div class="name">${esc(d.n)}</div><div class="sub">${d.w} W · ${esc(d.z.replace(/ \(.*\)/,""))}</div><div class="bar"><i style="width:${d.w/mx*100}%"></i></div></div></div>`).join("")||'<div class="rank sub">Gerade läuft nichts.</div>'}</div></section></div>
   </div><p class="note">${S.mode==="live"?"Der Solarverlauf füllt sich, solange die App geöffnet ist. Verbraucher zeigen die aktuelle Leistung.":"Beispielwerte."}</p>`}
};
const TITLES={home:["Startseite","home","var(--blue)"],rooms:["Räume","home","var(--blue)"],climate:["Klima","thermo","var(--orange)"],energy:["Heute","leaf","var(--green)"]};

function settingsModal(){
  return`<div class="scrim" data-close><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="st">
   <h3 id="st">Verbindung & Panel</h3>
   <p>Die App spricht direkt mit deinem Homey Pro im Heimnetz.</p>
   ${S.err?`<div class="msg err">${esc(S.err)}</div>`:S.mode==="live"?`<div class="msg ok">Verbunden · ${S.devices.length} Geräte</div>`:""}
   <div class="fld"><label for="f-addr">Homey-Adresse (IP)</label><input id="f-addr" inputmode="url" autocomplete="off" placeholder="z. B. 192.168.178.50" value="${esc(cfg.addr)}"></div>
   <div class="fld"><label for="f-key">API-Schlüssel</label><input id="f-key" type="password" autocomplete="off" placeholder="Schlüssel einfügen" value="${esc(cfg.key)}"><small>Wird nur auf diesem Gerät gespeichert.</small></div>
   <div class="fld"><label for="f-city">Ort fürs Wetter</label><input id="f-city" autocomplete="off" placeholder="z. B. Stockach" value="${esc(cfg.city)}"></div>
   <label class="trow" for="f-wake"><span>Bildschirm anlassen (Wandpanel)</span><input type="checkbox" id="f-wake" ${store.get("wake",false)?"checked":""}></label>
   <label class="trow" for="f-autonight"><span>Nachts abdunkeln (22–6 Uhr)</span><input type="checkbox" id="f-autonight" ${store.get("autonight",true)?"checked":""}></label>
   <div class="btns"><button class="btn" data-demo>Demo-Daten</button><button class="btn" data-close>Schließen</button><button class="btn primary" data-save>Speichern & verbinden</button></div>
  </div></div>`;
}

function render(){
  $("#view").innerHTML=V[S.view]();
  const [t,i,c]=TITLES[S.view];const h=$("#vt");h.style.setProperty("--accent",c);
  h.innerHTML=`${ic(i,20)}<span style="color:${S.view==="climate"||S.view==="energy"?c:"var(--fg)"}">${t}</span>`;
  document.querySelectorAll("nav.tabs [data-view]").forEach(b=>b.dataset.view===S.view?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  const cn=$("#conn");cn.className="conn"+(S.mode==="live"?" live":S.mode==="error"?" err":"");cn.querySelector("span").textContent=S.mode==="live"?"Live":S.mode==="error"?"Offline":"Demo";
  $("#modal").innerHTML=S.modal==="settings"?settingsModal():"";
}
function tick(){if(store.get("autonight",true)){const hr=new Date().getHours(),auto=hr>=22||hr<6;if(auto!==S.autoNight){S.autoNight=auto;setNight(auto)}}}
function setNight(on){S.night=on;document.body.classList.toggle("night",on);$("#nightbtn").setAttribute("aria-pressed",on)}

async function toggle(d,val){const prev=d.on,pw=d.w;d.on=val==null?!d.on:val;d.w=d.on?(d.base||0):0;render();
  if(await setCap(d,"onoff",d.on,()=>{d.on=prev;d.w=pw}))toast(`${d.n} ${d.on?"an":"aus"}`)}
function temp(d,delta){const prev=d.temp;d.temp=Math.min(28,Math.max(5,(d.temp??20)+delta));render();clearTimeout(d._t);d._t=setTimeout(()=>setCap(d,"target_temperature",d.temp,()=>{d.temp=prev}),600)}
async function scene(name){
  if(S.mode==="live"){await triggerFlow(name);return}
  const set=(n,v)=>{const d=S.devices.find(y=>y.n===n);if(d){d.on=v;d.w=v?d.base:0}};
  const lamps=v=>S.devices.filter(d=>d.t==="lamp").forEach(d=>{d.on=v;d.w=v?d.base:0});
  const th=t=>S.devices.filter(d=>d.t==="thermostat").forEach(d=>d.temp=t);
  if(name==="Guten Morgen"){set("Lampe Büro",true);set("LED Flur",true);th(21)}
  if(name==="Außer Haus"){lamps(false);["Strom Fernseher","TV Gästezimmer","Steckdose TV"].forEach(x=>set(x,false));th(17)}
  if(name==="Filmabend"){set("Strom Fernseher",true);set("Lavalampe",true);set("Ikea Lampe",true);set("Vitrine",false)}
  if(name==="Gute Nacht"){lamps(false);th(17)}
  toast(`„${name}“ ausgeführt (Demo)`);render();
}
async function media(cmd){
  const s=dev(S.spk);if(!s)return;
  if(cmd==="play"){const prev=s.playing;s.playing=!s.playing;render();if(S.mode!=="live"||s.caps.speaker_playing)await setCap(s,"speaker_playing",s.playing,()=>{s.playing=prev});else toast("Dieser Lautsprecher kann über Homey nicht starten");return}
  if(S.mode==="live"&&s.caps[cmd])await setCap(s,cmd,true);toast(cmd==="speaker_next"?"Nächster Titel":"Vorheriger Titel");
}
async function vac(state){
  const v=S.devices.find(d=>d.t==="vacuum");if(!v)return;const prev=v.vstate;v.vstate=state;render();
  if(S.mode==="live"){if(v.caps.vacuumcleaner_state)await setCap(v,"vacuumcleaner_state",state,()=>{v.vstate=prev});else if(v.caps.onoff)await setCap(v,"onoff",state==="cleaning");else{toast("Der Saugroboter bietet hier keine Steuerung an");return}}
  toast({cleaning:"Saugen gestartet",stopped:"Angehalten",docked:"Fährt zur Station"}[state]);
}
let wakeLock=null;
async function applyWake(){try{if(store.get("wake",false)&&"wakeLock" in navigator&&document.visibilityState==="visible"){wakeLock=await navigator.wakeLock.request("screen")}else if(wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}

document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-close]");if(!b)return;
  if(b.matches(".scrim")&&e.target!==b)return;
  if(b.dataset.close!==undefined){S.modal=null;render();return}
  if(b.dataset.open){S.modal=b.dataset.open;render();return}
  if(b.dataset.save!==undefined){cfg={addr:$("#f-addr").value.trim(),key:$("#f-key").value.trim(),city:$("#f-city").value.trim()};store.set("cfg",cfg);
    store.set("wake",$("#f-wake").checked);store.set("autonight",$("#f-autonight").checked);applyWake();S.modal=null;loadWeather();connect();return}
  if(b.dataset.demo!==undefined){S.err="";loadDemo();S.modal=null;render();toast("Demo-Daten geladen");return}
  if(b.id==="nightbtn"){setNight(!S.night);return}
  if(b.dataset.view){S.view=b.dataset.view;render();scrollTo(0,0);return}
  if(b.dataset.room){S.view="rooms";render();const el=document.getElementById(slug(b.dataset.room));if(el)el.scrollIntoView({block:"start"});else scrollTo(0,0);return}
  if(b.dataset.scene)return scene(b.dataset.scene);
  if(b.dataset.spk){S.spk=b.dataset.spk;render();return}
  if(b.dataset.media)return media(b.dataset.media);
  if(b.dataset.vac)return vac(b.dataset.vac);
  if(b.dataset.temp){const d=dev(b.dataset.temp);if(d)temp(d,+b.dataset.d);return}
  if(b.dataset.set){const d=dev(b.dataset.set);if(d)toggle(d,b.dataset.v==="1");return}
  if(b.dataset.tog){const d=dev(b.dataset.tog);if(d)toggle(d);return}
});
document.addEventListener("input",e=>{if(e.target.id==="vol"){S.vol=+e.target.value;$("#volv").textContent=S.vol;const s=dev(S.spk);if(s){s.vol=S.vol;clearTimeout(s._v);s._v=setTimeout(()=>{if(S.mode==="live"&&s.caps.volume_set)setCap(s,"volume_set",S.vol/100)},400)}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.modal){S.modal=null;render()}});
let idle;const resetIdle=()=>{clearTimeout(idle);idle=setTimeout(()=>{if(S.view!=="home"&&!S.modal){S.view="home";render()}},180000)};
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));resetIdle();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){applyWake();if(S.mode!=="demo")connect(true)}});
setInterval(()=>{if(S.mode==="live"&&document.visibilityState==="visible"&&!S.modal)connect(true)},10000);
setInterval(()=>{if(document.visibilityState==="visible")loadWeather()},900000);

tick();setInterval(tick,60000);render();applyWake();
if(cfg.addr&&cfg.key)connect(true);if(cfg.city)loadWeather();
</script>

</body>
</html>
