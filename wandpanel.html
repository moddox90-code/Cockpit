<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wandpanel">
<meta name="theme-color" content="#07090f">
<link rel="manifest" href="wandpanel.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="panel-192.png">
<link rel="apple-touch-icon" href="panel-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Davids Wandpanel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: one-screen landscape wall panel — fixed info rail left (clock, weather, energy today), right a three-way switch (Heizung / Licht / Steckdosen) whose tiles fill the remaining height. Stacks on narrow portrait screens. Dark-only by choice. */
:root{
  --bg:#0f1115; --rail:#161920; --tile:#1c2027; --tile-2:#252a33; --line:#2c323c;
  --fg:#eef1f6; --muted:#8b93a3; --dim:#5b6372;
  --heat:#ff8a3d; --cool:#5aa9ff; --light:#ffc861; --plug:#2fd3b0; --red:#ff5d64; --green:#7fd34e;
  --font:"Manrope",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  --gap:clamp(8px,1.4vh,14px); --r:clamp(14px,2.4vh,22px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:var(--font);font-size:clamp(15px,2.9vh,21px);line-height:1.3;font-variant-numeric:tabular-nums;transition:filter .6s}
body.night{filter:brightness(.55) saturate(.8)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.panel{height:100%;display:grid;grid-template-columns:minmax(240px,31%) minmax(0,1fr);gap:var(--gap);padding:var(--gap) max(var(--gap),env(safe-area-inset-right,0px)) var(--gap) max(var(--gap),env(safe-area-inset-left,0px))}

/* rail */
.rail{background:var(--rail);border-radius:var(--r);padding:clamp(14px,2.6vh,24px);display:flex;flex-direction:column;gap:clamp(8px,1.8vh,18px);min-height:0;overflow-y:auto;scrollbar-width:none}
@media (max-height:470px) and (min-aspect-ratio:1/1){.rail .blk.wbox{display:none}}
.time{font-size:clamp(54px,14vh,120px);font-weight:800;letter-spacing:-.04em;line-height:.95}
.date{color:var(--muted);font-weight:600;margin-top:4px;font-size:1.05em}
.wx{display:flex;align-items:center;gap:12px}
.wx b{font-size:clamp(30px,7vh,52px);font-weight:700;letter-spacing:-.03em}
.wx .sub{color:var(--muted);font-size:.9em;line-height:1.25}
.blk{border-top:1px solid var(--line);padding-top:clamp(10px,2vh,16px);display:flex;flex-direction:column;gap:8px}
.lab{font-size:max(11px,.72em);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.erow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.erow b{font-weight:700;white-space:nowrap}
.ebar{height:6px;border-radius:3px;background:var(--tile-2);overflow:hidden}
.ebar i{display:block;height:100%;border-radius:3px}
.inside{display:flex;gap:16px;font-weight:700;font-size:1.25em}
.inside span{display:inline-flex;align-items:center;gap:6px}
.inside svg{color:var(--muted)}
.warns{display:flex;flex-direction:column;gap:4px;font-size:.85em}
.warns div{display:flex;gap:8px;align-items:center;color:#ffb3b6;min-width:0}
.warns div span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{margin-top:auto;display:flex;align-items:center;gap:8px}
.conn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:999px;border:0;background:var(--tile);color:var(--muted);font-weight:600;font-size:.9em}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.conn.live i{background:var(--green)}.conn.err i{background:var(--red)}
.rbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--tile);display:grid;place-items:center;color:var(--fg)}
.rbtn[aria-pressed="true"]{color:var(--light)}
.foot .rbtn:first-of-type{margin-left:auto}
.rbtn{position:relative}
.rbtn .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;line-height:1}
.sun{display:flex;gap:18px;font-weight:700;margin-top:-4px}
.sun span{display:inline-flex;align-items:center;gap:7px}
.sun svg{color:var(--light)}
.hours{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;text-align:center}
.hours div{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.hours span{color:var(--muted);font-size:.78em;font-weight:600}
.hours i{display:grid;place-items:center}
.hours b{font-weight:700;font-size:.95em}
.hlist{display:flex;flex-direction:column;gap:6px}
.hlist div{display:flex;gap:10px;align-items:center;background:var(--tile);border-radius:12px;padding:10px 12px}
.hlist .r{color:var(--red)}.hlist .y{color:var(--light)}
.hlist small{display:block;color:var(--muted)}

/* main */
.main{display:flex;flex-direction:column;gap:var(--gap);min-width:0;min-height:0}
/* detail header */
.seg{display:flex;align-items:center;gap:12px;background:var(--rail);border-radius:999px;padding:6px 16px 6px 6px;min-width:0}
.seg[hidden]{display:none!important}
.back{border:0;background:var(--tile-2);border-radius:999px;height:clamp(40px,7vh,52px);padding:0 18px 0 12px;display:inline-flex;align-items:center;gap:8px;font-weight:700;flex:none}
.seg h2{margin:0;font-size:1.25em;font-weight:800;display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap}
.seg h2 svg{color:var(--acc)}
.seg .info{margin-left:auto;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* home: category tiles */
.area.home{grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
.cat{grid-column:span 2;position:relative;border:0;border-radius:var(--r);background:var(--tile);padding:clamp(14px,2.6vh,24px);display:flex;flex-direction:column;justify-content:space-between;text-align:left;min-width:0;min-height:0;overflow:hidden;isolation:isolate;transition:transform .12s}
.cat.wide{grid-column:span 3}
.cat::after{content:"";position:absolute;right:-30%;top:-40%;width:80%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--acc) 0,transparent 65%);opacity:.16;z-index:-1}
.cat .ci{width:clamp(44px,8vh,64px);height:clamp(44px,8vh,64px);border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.07);background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.cat .ct{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cat .go{color:var(--dim)}
.cat h3{margin:0;font-size:clamp(20px,4.2vh,34px);font-weight:800;letter-spacing:-.02em}
.cat .s1{font-size:clamp(15px,2.7vh,21px);font-weight:700;margin-top:4px}
.cat .s2{color:var(--muted);font-weight:600;font-size:.92em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat:active{transform:scale(.98)}
/* solar page */
.area.solar{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-flow:dense;grid-auto-rows:auto;align-content:start}
.sc{background:var(--tile);border-radius:var(--r);padding:clamp(12px,2.2vh,18px);min-width:0;display:flex;flex-direction:column;gap:8px}
.sc.span3{grid-column:1/-1}.sc.span2{grid-column:span 2}
.sc .lab{margin:0}
.sc .kv{font-size:clamp(28px,6.5vh,50px);font-weight:800;letter-spacing:-.03em;line-height:1}
.sc .kv small{font-size:.4em;color:var(--muted);font-weight:700;letter-spacing:0;margin-left:4px}
.sc .ksub{color:var(--muted);font-weight:600;font-size:.9em}
.sc .bat{height:10px;border-radius:5px;background:var(--tile-2);overflow:hidden}
.sc .bat i{display:block;height:100%;border-radius:5px}
.dh{display:flex;align-items:center;gap:12px;min-width:0}
.dh .ico{width:40px;height:40px;flex:none;display:grid;place-items:center}
.dh .ico svg,.dh .ico img{width:100%;height:100%}
.dh b{font-size:1.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh .hv{margin-left:auto;font-weight:800;font-size:1.3em;white-space:nowrap}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;font-size:.88em}
.caps div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:4px 0;min-width:0}
.caps span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.caps b{white-space:nowrap}
.schart{width:100%;height:auto;display:block}
.schart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.area{flex:1;min-height:0;display:grid;gap:var(--gap);grid-auto-rows:minmax(0,1fr);overflow:auto}
.area.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.area.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.area.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.area.c5{grid-template-columns:repeat(5,minmax(0,1fr));font-size:.9em}
.area.c5 .sw .pw{width:34px;height:34px}
.bar2{display:flex;justify-content:flex-end;gap:8px}
.pillbtn{border:0;background:var(--rail);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9em;color:var(--muted);display:inline-flex;gap:8px;align-items:center}

/* heating tile */
.heat{position:relative;background:var(--tile);border-radius:var(--r);padding:clamp(12px,2.2vh,20px);display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr auto;gap:6px 12px;min-height:0;overflow:hidden;isolation:isolate}
.heat::before{content:"";position:absolute;inset:auto 0 0 0;height:5px;background:var(--cool);z-index:-1}
.heat.on::before{background:var(--heat)}
.heat .room{font-weight:700;font-size:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat .state{justify-self:end;font-size:.82em;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(90,169,255,.14);color:var(--cool);white-space:nowrap}
.heat.on .state{background:rgba(255,138,61,.16);color:var(--heat)}
.heat .target{grid-column:1/-1;align-self:center;display:flex;align-items:baseline;gap:10px;min-width:0}
.heat .target b{font-size:clamp(42px,11vh,96px);font-weight:800;letter-spacing:-.04em;line-height:1}
.heat .target span{color:var(--muted);font-weight:700;white-space:nowrap;font-size:1.05em}
.heat .ctl{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.heat .ctl button{border:0;border-radius:clamp(10px,1.8vh,16px);background:var(--tile-2);height:clamp(44px,9vh,72px);font-size:clamp(22px,4vh,32px);font-weight:600;display:grid;place-items:center}
.heat .ctl button:active{background:#323844}
.heat .low{color:var(--red);font-size:.8em;font-weight:700}

/* switch tile (light / plug): icon top-left, round power button top-right, name + status below */
.sw{position:relative;border:0;background:var(--tile);border-radius:var(--r);padding:clamp(12px,2.2vh,18px);display:flex;flex-direction:column;justify-content:space-between;text-align:left;min-height:0;min-width:0;overflow:hidden;transition:background .2s}
.sw .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sw .ico{display:grid;place-items:center;color:var(--fg);width:clamp(34px,7vh,52px);height:clamp(34px,7vh,52px);flex:none}
.sw .ico svg,.sw .ico img{width:100%;height:100%}
.dimg{filter:invert(1);opacity:.92;object-fit:contain}
.sw .pw{width:clamp(36px,7vh,48px);height:clamp(36px,7vh,48px);border-radius:50%;background:var(--tile-2);color:#c9ced8;display:grid;place-items:center;flex:none;transition:all .2s}
.sw.on .pw{background:rgba(76,141,255,.22);color:#4c8dff}
.sw.light.on .pw{background:rgba(255,200,97,.22);color:var(--light)}
.sw.on{background:#232832}
.sw .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.sw b{font-weight:600;font-size:1.08em;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.sw small{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:.92em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw small.watt{color:#4c8dff}
.sw small.day{font-size:.8em;color:var(--dim)}
.sw .dotl{width:12px;height:12px;border-radius:50%;background:var(--light);display:inline-block;flex:none}
.sw.off-line{opacity:.45}
.sw .warn{color:var(--red)}
.sw:active{transform:scale(.98)}
.sw.air .airval{display:flex;flex-direction:column;gap:4px}
.sw.air .big{font-size:clamp(40px,10vh,84px);font-weight:800;letter-spacing:-.04em;line-height:1}
.sw.air .big small{font-size:.35em;font-weight:700;color:var(--muted);letter-spacing:0}
.sw.air .lbl{color:var(--muted);font-weight:600;font-size:.95em}
.sw.air .lbl i{font-style:normal;font-weight:700}
.sw.air.on .pw{background:rgba(47,211,176,.2);color:var(--plug)}
.hico{display:inline-grid;width:30px;height:30px;vertical-align:middle;margin-right:8px;color:var(--fg)}
.hico svg,.hico img{width:100%;height:100%}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:grid;place-items:center;padding:16px}
.dlg{background:var(--rail);border-radius:22px;padding:20px;width:min(560px,100%);max-height:94vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:20px}
.dlg p{margin:0;color:var(--muted);font-size:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13px;font-weight:700;color:var(--muted)}
.fld input{background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;width:100%}
.fld input:focus{outline:2px solid var(--cool);outline-offset:0}
.fld small{color:var(--dim);font-size:12px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--tile);border-radius:12px;padding:11px 12px}
.trow input{width:22px;height:22px;accent-color:var(--cool)}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:0;background:var(--tile-2);border-radius:12px;padding:11px 16px;font-weight:700}
.btn.primary{background:var(--cool);color:#06121f}
.msg{font-size:14px;padding:10px 12px;border-radius:12px}
.msg.err{background:rgba(255,93,100,.14);color:#ffb3b6}
.msg.ok{background:rgba(127,211,78,.14);color:#c4ec9f}
.toast{position:fixed;left:50%;transform:translate(-50%,8px);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}

/* narrow / portrait */
@media (max-width:760px),(max-aspect-ratio:1/1){
  html,body{overflow:auto}
  .panel{height:auto;min-height:100%;grid-template-columns:minmax(0,1fr)}
  .rail{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:16px}
  .rail .clockbox{grid-row:span 2}
  .rail .blk,.rail .foot{grid-column:1/-1}
  .time{font-size:56px}
  .area{overflow:visible;grid-auto-rows:minmax(150px,auto)}
  .area.c3,.area.c4,.area.c5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .area.home{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(140px,auto)}
  .cat,.cat.wide{grid-column:span 1}
  .area.solar{grid-template-columns:minmax(0,1fr)}
  .sc.span2{grid-column:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Look v3.1: "Midnight Glass" — tiefe Nachtfarben, Glasflächen, Farbakzente je Bereich ===== */
:root{--bg:#07090f;--rail:rgba(22,27,40,.62);--tile:rgba(28,34,50,.58);--tile-2:rgba(255,255,255,.07);--line:rgba(255,255,255,.08);
  --fg:#f1f4fa;--muted:#94a0b8;--dim:#5f6a82;--r:clamp(18px,3vh,28px);--gap:clamp(10px,1.6vh,16px);--edge:rgba(255,255,255,.09);--hi:rgba(255,255,255,.14)}
body{background:var(--bg)}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 45% at 8% 12%,rgba(64,110,255,.30),transparent 70%),
             radial-gradient(35% 40% at 92% 88%,rgba(255,150,60,.18),transparent 70%),
             radial-gradient(30% 35% at 70% 10%,rgba(47,211,176,.14),transparent 70%)}
.rail,.cat,.sw,.heat,.sc,.seg{backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);box-shadow:inset 0 1px 0 var(--hi),0 10px 30px rgba(0,0,0,.28);border:1px solid var(--edge)}
.rail{background:linear-gradient(180deg,rgba(30,37,56,.70),rgba(18,22,34,.62))}
.time{font-weight:300;letter-spacing:-.05em;background:linear-gradient(180deg,#fff,#b9c6e6);-webkit-background-clip:text;background-clip:text;color:transparent}
.date{text-transform:capitalize;letter-spacing:.01em}
.wx b{font-weight:400}
.lab{color:#7d89a3;letter-spacing:.16em}
.blk{border-top-color:var(--line)}
.ebar{height:8px;background:rgba(255,255,255,.06)}
.ebar i{box-shadow:0 0 12px currentColor}
.hours div{background:rgba(255,255,255,.04);border-radius:12px;padding:6px 0}
.sun{color:var(--fg)}
.conn,.rbtn{background:rgba(255,255,255,.07);border:1px solid var(--edge)}
.conn.live{color:#c9f2b3}
/* Übersicht-Kacheln */
.cat{background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 22%,rgba(28,34,50,.7)) 0%,rgba(24,29,43,.62) 55%);transition:transform .15s,box-shadow .2s}
.cat::after{opacity:.28;right:-20%;top:-50%;width:90%}
.cat .ci{border-radius:50%;width:clamp(48px,9vh,70px);height:clamp(48px,9vh,70px);background:color-mix(in srgb,var(--acc) 26%,transparent);box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 8%,transparent)}
.cat .go{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--fg)}
.cat h3{font-weight:700;font-size:clamp(18px,3.4vh,28px);color:#dfe5f2}
.cat .s1{font-size:clamp(20px,4.2vh,34px);font-weight:800;letter-spacing:-.02em;color:var(--fg)}
.cat .s2{font-weight:500}
.cat:hover{box-shadow:inset 0 1px 0 var(--hi),0 14px 40px rgba(0,0,0,.35)}
/* Kopfzeile Detailseite */
.seg{background:rgba(22,27,40,.65);padding:6px 18px 6px 6px}
.back{background:rgba(255,255,255,.09);border:1px solid var(--edge)}
.seg h2{font-weight:800}
/* Geräte-Kacheln */
.sw{background:rgba(28,34,50,.55)}
.sw .pw{background:rgba(255,255,255,.07);border:1px solid var(--edge)}
.sw.on{background:linear-gradient(150deg,rgba(76,141,255,.20),rgba(28,34,50,.55) 60%)}
.sw.on .pw{background:#4c8dff;color:#fff;box-shadow:0 0 18px rgba(76,141,255,.55);border-color:transparent}
.sw.light.on{background:linear-gradient(150deg,rgba(255,200,97,.24),rgba(28,34,50,.55) 60%)}
.sw.light.on .pw{background:var(--light);color:#2a1b00;box-shadow:0 0 18px rgba(255,200,97,.55)}
.sw.air.on{background:linear-gradient(150deg,rgba(47,211,176,.20),rgba(28,34,50,.55) 60%)}
.sw.air.on .pw{background:var(--plug);color:#04241d;box-shadow:0 0 18px rgba(47,211,176,.5)}
.sw small.watt{color:#8db8ff}
/* Heizung */
.heat{background:rgba(28,34,50,.55)}
.heat::before{display:none}
.heat.on{background:linear-gradient(150deg,rgba(255,138,61,.22),rgba(28,34,50,.55) 60%)}
.heat .target b{font-weight:300}

function baseUrl(a){a=(a||"").trim().replace(/\/+$/,"");if(!a)return"";if(/^https?:\/\//.test(a))return a;
  if(/^\d+\.\d+\.\d+\.\d+$/.test(a))return`https://${a.replace(/\./g,"-")}.homey.homeylocal.com`;return"https://"+a}
async function api(path,opt={}){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),opt.timeout||12000);
  const r=await fetch(baseUrl(cfg.addr)+path,{...opt,signal:ac.signal,headers:{"Authorization":"Bearer "+cfg.key,"Content-Type":"application/json"}});
  if(r.status===401||r.status===403)throw new Error("API-Schlüssel abgelehnt (fehlende Rechte?)");
  if(!r.ok)throw new Error("Homey antwortet mit Fehler "+r.status);
  clearTimeout(tm);const t=await r.text();return t?JSON.parse(t):null;
}
/* Anzeigenamen: Homey-Name -> Name in der App */
const RENAME={}; /* leer: die App zeigt die Namen aus Homey */
const nm=n=>RENAME[n]||n;
const CLS={light:"lamp",socket:"socket",thermostat:"thermostat",heater:"thermostat",vacuumcleaner:"vacuum",speaker:"speaker",tv:"speaker",camera:"camera",sensor:"sensor",solarpanel:"solar",battery:"battery",airpurifier:"air",airconditioning:"air",fan:"air",dehumidifier:"air",humidifier:"air",button:"button",remote:"button",other:"router"};
function mapDevice(d,zones){
  const c=d.capabilitiesObj||{},v=k=>c[k]?c[k].value:undefined;
  const info=[d.name,d.driverId,d.driverUri,d.ownerUri,d.class].join(" ");
  let t=CLS[d.virtualClass||d.class]||"router";
  if(/eco ?flow/i.test(info)&&/plug|steckdose|socket/i.test(info))t="socket";
  const cc=d.capabilitiesObj||{};
  const swCap=cc.onoff?"onoff":(["set_power_supply_smartplug","switchstate"].find(k=>cc[k]&&cc[k].setable!==false&&(cc[k].type==="boolean"||typeof cc[k].value==="boolean"))||Object.keys(cc).find(k=>cc[k]&&cc[k].setable&&cc[k].type==="boolean"&&/switch|power_supply|relay/i.test(k)));
  if(swCap&&(t==="router"||t==="sensor"||t==="button"||(/^EF[ -]|eco ?flow/i.test(d.name||"")&&t!=="battery"&&!/solar|stream/i.test(d.name||""))))t="socket";
  const stCap=cc.onoff?"onoff":(cc.switchstate&&typeof cc.switchstate.value==="boolean"?"switchstate":swCap);
  const o={raw:{cls:d.class,vcls:d.virtualClass,drv:d.driverId||d.driverUri||"",caps:Object.keys(cc)},id:d.id,n:nm(d.name),z:(zones[d.zone]&&zones[d.zone].name)||"Ohne Raum",t,caps:c,live:true};
  if(swCap){o.swCap=swCap;const sv=v(stCap);o.on=sv===undefined?!!v(swCap):!!sv}
  const w=v("measure_power");if(w!=null)o.w=Math.round(w);else if('on' in o)o.w=0;
  if(v("target_temperature")!=null)o.temp=v("target_temperature");
  if(v("measure_temperature")!=null)o.cur=v("measure_temperature");
  if(v("measure_humidity")!=null)o.hum=Math.round(v("measure_humidity"));
  if(v("measure_battery")!=null)o.batt=Math.round(v("measure_battery"));
  if(v("measure_pm25")!=null)o.pm=Math.round(v("measure_pm25"));
  if(v("vacuumcleaner_state")!=null)o.vstate=v("vacuumcleaner_state");
  if(v("speaker_playing")!=null)o.playing=!!v("speaker_playing");
  if(v("volume_set")!=null)o.vol=Math.round(v("volume_set")*100);
  if(v("speaker_track")!=null)o.track=v("speaker_track");
  if(v("speaker_artist")!=null)o.artist=v("speaker_artist");
  if(t==="solar")o.gen=true;
  if(d.iconObj&&d.iconObj.url)o.icon=baseUrl(cfg.addr)+d.iconObj.url;
  o.meter=Object.keys(c).find(k=>k==="meter_power")||Object.keys(c).find(k=>k.startsWith("meter_power"));o.hasPower=!!c.measure_power;
  if(d.available===false)o.warn=d.unavailableMessage||"Nicht erreichbar";
  else if(v("alarm_battery")===true&&o.batt==null)o.warn="Batterie schwach";
  o.base=o.w||6;return o;
}
async function connect(silent){
  if(!cfg.addr||!cfg.key){loadDemo();render();return}
  if(sandboxed){S.mode="demo";S.err="In dieser Vorschau sind Verbindungen gesperrt. Öffne die App über GitHub im Heimnetz.";render();return}
  try{
    const [devs,zones]=await Promise.all([api("/api/manager/devices/device/"),api("/api/manager/zones/zone/")]);
    S.devices=Object.values(devs).map(d=>mapDevice(d,zones));
    S.mode="live";S.err="";
    api("/api/manager/users/user/").then(u=>{S.users=Object.values(u).map(x=>({name:x.name,present:x.present,asleep:x.asleep}));render()}).catch(()=>{});
    Promise.all([api("/api/manager/flow/flow/").catch(()=>({})),api("/api/manager/flow/advancedflow/").catch(()=>({}))])
      .then(([a,b])=>{S.flows=[...Object.values(a).map(f=>({id:f.id,name:f.name,adv:false})),...Object.values(b).map(f=>({id:f.id,name:f.name,adv:true}))]});
    if(!S.dailyAt||Date.now()-S.dailyAt>300000||S.daily!=="ok")loadDaily();else applyDaily();
    if(!silent)toast("Mit Homey verbunden");
  }catch(e){
    S.err=e.name==="TypeError"?"Homey nicht erreichbar. Bist du im Heimnetz und stimmt die Adresse?":e.message;
    if(!S.devices.length||!S.devices[0].live)loadDemo();S.mode="error";
  }
  render();
}
async function setCap(d,cap,value,revert){
  if(S.mode!=="live")return true;
  try{await api(`/api/manager/devices/device/${d.id}/capability/${cap}`,{method:"PUT",body:JSON.stringify({value})});return true}
  catch(e){revert&&revert();toast("Fehler: "+e.message);render();return false}
}
async function triggerFlow(name){
  const f=S.flows.find(x=>x.name.trim().toLowerCase()===name.toLowerCase());
  if(!f){toast(`Lege in Homey einen Flow „${name}“ an`);return false}
  try{await api(`/api/manager/flow/${f.adv?"advancedflow":"flow"}/${f.id}/trigger`,{method:"POST",body:"{}"});toast(`„${name}“ gestartet`);setTimeout(()=>connect(true),1500);return true}
  catch(e){toast("Fehler: "+e.message);return false}
}

/* Tageswerte aus dem Homey-Verlauf (Insights) */
let DAILY={};
let LOGIX=null;
let LOGSAMPLE="";
async function logIndex(){if(LOGIX)return LOGIX;const all=await api("/api/manager/insights/log/");LOGIX={};try{LOGSAMPLE=Object.entries(all||{}).slice(0,2).map(([k,l])=>k+" → "+JSON.stringify({id:l.id,uri:l.uri,ownerUri:l.ownerUri,ownerId:l.ownerId})).join(" ; ")}catch(e){}Object.values(all||{}).forEach(l=>{if(!l)return;const ou=l.ownerUri||l.uri||"",oi=l.ownerId||l.id||"";const dev=(ou.match(/homey:device:([\w-]+)/)||[])[1]||(String(l.id||"").match(/homey:device:([\w-]+)/)||[])[1];const cap=l.ownerId&&l.ownerUri?l.ownerId:String(l.id||"").split(":").pop();if(dev)LOGIX[dev+"|"+cap]={uri:ou||("homey:device:"+dev),id:oi&&l.ownerUri?oi:cap,full:String(l.id||"").includes(":")?l.id:(ou||("homey:device:"+dev))+":"+cap}});return LOGIX}
let INS_MODE=null,INS_TRIED=[];
async function insightsToday(id,cap){let uri="homey:device:"+id,full=uri+":"+cap;try{const ix=await logIndex();const x=ix[id+"|"+cap];if(x){uri=x.uri;full=x.full}}catch(e){}
  const E=encodeURIComponent,mid=new Date();mid.setHours(0,0,0,0);
  const forms=[["a",`/api/manager/insights/log/${uri}/${full}/entry?resolution=today`,false],["b",`/api/manager/insights/log/${E(uri)}/${E(full)}/entry?resolution=today`,false],["c",`/api/manager/insights/log/${uri}/${full}/entry?resolution=last24Hours`,true],["d",`/api/manager/insights/log/${uri}/${full}/entry`,true]];
  const order=INS_MODE?forms.filter(f=>f[0]===INS_MODE):forms;let last;
  for(const [m,path,cut] of order){try{const r=await api(path);INS_MODE=m;let vals=((r&&(r.values||r.entries))||(Array.isArray(r)?r:[])).filter(x=>x&&x.v!=null);if(cut)vals=vals.filter(x=>new Date(x.t)>=mid);return vals}catch(e){last=e;if(INS_TRIED.length<8&&!INS_TRIED.some(t=>t.startsWith(m+":")))INS_TRIED.push(m+": "+e.message)}}
  throw last;
}
function applyDaily(){S.devices.forEach(d=>{const x=DAILY[d.id];if(x&&x.first!=null){const cur=d.caps&&d.caps[d.meter]&&d.caps[d.meter].value;d.kwh=Math.max(0,(cur!=null?cur:x.last)-x.first)}})}
/* EcoFlow / Smart Meter: Quellen erkennen */
var GRID={};
const capsOf=d=>Object.entries(d.caps||{}).filter(([k,c])=>c&&typeof c.value==="number");
const isW=c=>!c.units||/^W$/i.test(c.units);
const isKWh=c=>/kWh/i.test(c.units||"");
function gridDev(){return S.devices.find(d=>/^BK\d/i.test(d.n)||/smart ?meter|smartmeter/i.test(d.n+" "+(d.raw?d.raw.drv:"")))}
function ultraDev(){return S.devices.find(d=>/stream\s*ultra/i.test(d.n))||S.devices.find(d=>/stream/i.test(d.n)&&d.t==="battery")}
function pvSource(){
  const u=ultraDev();
  if(u){const c=capsOf(u).find(([k,c])=>isW(c)&&/(pv|solar).*(total|sum)|(total|sum).*(pv|solar)/i.test(k))||capsOf(u).find(([k,c])=>isW(c)&&/pv|solar/i.test(k)&&!/limit/i.test(k));if(c)return{d:u,cap:c[0]}}
  const devs=S.devices.filter(d=>d.t!=="socket"&&d!==gridDev()&&(d.gen||d.t==="battery"||/stream|delta|powerstream|ecoflow/i.test(d.n)));
  for(const d of devs){const c=capsOf(d).find(([k,c])=>isW(c)&&/(pv|solar).*(total|sum)|(total|sum).*(pv|solar)/i.test(k));if(c)return{d,cap:c[0]}}
  for(const d of devs){const c=capsOf(d).find(([k,c])=>isW(c)&&/^(measure_power\.)?(pv|solar)$/i.test(k));if(c)return{d,cap:c[0]}}
  const g=S.devices.find(d=>d.gen&&d.hasPower);if(g)return{d:g,cap:"measure_power"};
  return null;

  if(k==="solar"){const T=dayTotals(),B=batteryInfo(),g=gridNow();return[`${pvNow()} W Solar`,[T.ready?`heute ${fE(T.sol)}`:null,B.main?`Akku ${B.main.batt} %`:null,g!=null?(g<0?`speist ${-g} W ein`:`Netz ${g} W`):null].filter(Boolean).join(" · ")||"EcoFlow"]}
}
function segHTML(){
  const sg=$("#seg");if(TAB==="home"){sg.hidden=true;return""}sg.hidden=false;
  const [t,i,c]=CATS[TAB],[s1,s2]=catSummary(TAB);sg.style.setProperty("--acc",c);
  return`<button class="back" data-tab="home" aria-label="Zurück zur Übersicht"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Übersicht</button><h2>${ic(i,24)}${t}</h2><span class="info">${esc(s1)} · ${esc(s2)}</span>`;
}
function homeHTML(){
  return Object.entries(CATS).map(([k,[t,i,c]],ix)=>{const [s1,s2]=catSummary(k);
    return`<button class="cat${ix>=3?" wide":""}" data-tab="${k}" style="--acc:${c}"><span class="ct"><span class="ci">${ic(i,30,2)}</span><span class="go">${ic("chev",24,2.4)}</span></span><span><h3>${t}</h3><div class="s1">${esc(s1)}</div><div class="s2">${esc(s2)}</div></span></button>`}).join("");
}
function fmtCap(c){if(typeof c.value==="boolean")return c.value?"Ja":"Nein";let v=c.value;if(typeof v==="number")v=(Math.round(v*10)/10).toString().replace(".",",");return v+(c.units?" "+c.units:"")}
function capTitle(k,c){const t=c.title;return (typeof t==="string"?t:t&&(t.de||t.en))||k.replace(/_/g," ")}
function solarChart(){
  const H=S.solarHist,W=600,Hh=150,l=36,b=22,t=6,max=Math.max(100,...H),top=Math.ceil(max/100)*100,x=i=>l+i*(W-l-6)/23,y=v=>Hh-b-(v/top)*(Hh-b-t);
  const line=H.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" "),now=new Date().getHours();
  return`<svg class="schart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Solarleistung heute in Watt">${[0,.5,1].map(f=>`<line x1="${l}" x2="${W}" y1="${y(top*f)}" y2="${y(top*f)}" stroke="#2c323c"/><text x="${l-6}" y="${y(top*f)+4}" text-anchor="end">${Math.round(top*f)}</text>`).join("")}
   <path d="${line} L${x(23)} ${y(0)} L${x(0)} ${y(0)}Z" fill="rgba(255,181,71,.18)"/><path d="${line}" fill="none" stroke="#ffb547" stroke-width="2.2"/><circle cx="${x(now)}" cy="${y(H[now]||0)}" r="4.5" fill="#ffb547" stroke="#1c2027" stroke-width="2"/>
   ${[0,6,12,18,23].map(i=>`<text x="${x(i)}" y="${Hh-5}" text-anchor="middle">${i===23?"24":i}:00</text>`).join("")}</svg>`;
}
function solarHTML(){
  const T=dayTotals(),pv=pvNow(),g=gridNow(),B=batteryInfo(),gc0=gridCheck(),devs=ultraDev()?[ultraDev()].concat(gc0.src=="meter"&&gridDev()?[gridDev()]:[]):solarDevs();
  const hcNow=houseCap(),house=hcNow?Math.max(0,hcNow.v):null;
  const kpi=(lab,val,unit,sub,col)=>`<div class="sc"><span class="lab">${lab}</span><div class="kv" style="color:${col}">${val}<small>${unit}</small></div><div class="ksub">${sub}</div></div>`;
  const E=k=>{const [v,u]=eParts(T.ready?k:null);return[v,u]};
  const [sv,su]=E(T.sol),[hv,hu]=E(T.house),[iv,iu]=E(T.imp),[xv,xu]=E(T.exp);
  let h=kpi("Solar jetzt",pv,"W",`heute ${sv} ${su}`,"#ffb547")
   +(()=>{const c=gridCheck();if(c.v==null)return"";const [iv,iu]=E(T.imp),[xv,xu]=E(T.exp);
      const src=c.src==="ultra"?"laut STREAM Ultra":"laut Messgerät am Sicherungskasten";
      const chk=c.u!=null&&c.m!=null?`<div class="ksub" style="color:${c.ok?"var(--green)":"var(--light)"}">${c.ok?"✓ stimmig":"⚠ "+esc(c.why)}: Ultra ${c.u} W · Zähler ${c.m} W</div>`:c.why?`<div class="ksub" style="color:var(--light)">⚠ ${esc(c.why)}</div>`:"";
      return`<div class="sc"><span class="lab">${c.v<0?"Einspeisung jetzt":"Vom Netz jetzt"}</span><div class="kv" style="color:var(--cool)">${Math.abs(c.v)}<small>W</small></div><div class="ksub">${src}${T.imp!=null?` · heute ${iv} ${iu} bezogen${T.exp?`, ${xv} ${xu} eingespeist`:""}`:""}</div>${chk}</div>`})()
   +`<div class="sc"><span class="lab">Speicher</span><div class="kv" style="color:${B.main&&B.main.batt<15?"var(--red)":"var(--green)"}">${B.main?B.main.batt:"–"}<small>%</small></div><div class="bat"><i style="width:${B.main?B.main.batt:0}%;background:${B.main&&B.main.batt<15?"var(--red)":"var(--green)"}"></i></div><div class="ksub">${B.pw!=null?(B.pw>0?`lädt mit ${B.pw} W`:B.pw<0?`entlädt ${-B.pw} W`:"Ruhe"):""}${B.list.length>1?" · "+B.list.filter(d=>d!==B.main).map(d=>esc(d.n)+" "+d.batt+" %").join(" · "):""}</div></div>`
   +(T.house!=null?kpi("Hausverbrauch heute",hv,hu,hcNow?`jetzt ${house} W`:"aus Zähler + Solar","var(--fg)"):"")
   +`<div class="sc span2"><span class="lab">Solarleistung heute · Quelle ${esc(ultraDev()?ultraDev().n:"EcoFlow")}</span>${solarChart()}</div>`;
  h+=devs.map(d=>{const caps=Object.entries(d.caps||{}).filter(([k,c])=>c&&(typeof c.value==="number"||typeof c.value==="boolean")&&!/^(onoff|measure_battery)$/.test(k)&&!(k.startsWith("alarm_")&&!c.value)).slice(0,10);
    const hv=d.batt!=null?`${d.batt} %`:d.w!=null?`${fmtW(d.w)} W`:"";
    return`<div class="sc${caps.length>4?" span2":""}"><div class="dh"><span class="ico">${devImg(d,d.t==="battery"?"batt":"solar",40)}</span><b>${esc(d.n)}</b><span class="hv">${hv}</span></div>${d.warn?`<div class="ksub" style="color:var(--red)">${esc(d.warn)}</div>`:""}
     ${caps.length?`<div class="caps">${caps.map(([k,c])=>`<div><span>${esc(capTitle(k,c))}</span><b>${esc(fmtCap(c))}</b></div>`).join("")}</div>`:`<div class="ksub">${esc(shortZone(d.z))}</div>`}</div>`}).join("");
  return h;
}
function heatTile(d){
  const on=d.temp!=null&&d.cur!=null&&d.temp>d.cur;
  return`<div class="heat${on?" on":""}"><span class="room"><span class="hico">${devImg(d,"radiator",30)}</span>${esc(shortZone(d.z))}</span><span class="state">${on?"heizt":"hält"}</span>
   <div class="target"><b>${fT(d.temp)}°</b><span>Ist ${fT(d.cur)}°</span>${d.batt!=null&&d.batt<=40?`<span class="low">Batterie ${d.batt} %</span>`:""}</div>
   <div class="ctl"><button data-temp="${d.id}" data-d="-0.5" aria-label="${esc(d.n)} kälter">${ic("minus",26,2.4)}</button><button data-temp="${d.id}" data-d="0.5" aria-label="${esc(d.n)} wärmer">${ic("plus",26,2.4)}</button></div></div>`;
}
function devImg(d,fallback,size){return d.icon?`<img class="dimg" src="${esc(d.icon)}" width="${size}" height="${size}" alt="" onerror="this.replaceWith(document.createRange().createContextualFragment(this.dataset.fb))" data-fb='${ic(fallback,size,1.6)}'>`:ic(fallback,size,1.6)}
const PW='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v8M6.3 7.3a8 8 0 1 0 11.4 0"/></svg>';
function swTile(d,kind){
  const off=d.warn?" off-line":"",fb=kind==="plug"?"socket":"lamp",can='on' in d;
  const st=d.warn?`<small class="warn">${esc(d.warn)}</small>`:kind==="plug"?(can&&!d.on?`<small>Aus</small>`:`<small class="watt">${ic("bolt",15,2.2)} ${fmtW(d.w)} W</small>`):`<small>${d.on?'<i class="dotl"></i>An':"Aus"}</small>`;
  const inner=`<span class="top"><span class="ico">${devImg(d,fb,46)}</span>${can?`<span class="pw">${PW}</span>`:""}</span><span class="txt"><b>${esc(d.n)}</b>${st}${kind==="plug"&&d.kwh!=null?`<small class="day">heute ${fE(d.kwh)}</small>`:""}</span>`;
  return can?`<button class="sw ${kind}${d.on?" on":""}${off}" data-tog="${d.id}" aria-pressed="${d.on}">${inner}</button>`:`<div class="sw ${kind}${off}">${inner}</div>`;
}
const fmtW=w=>w==null?"–":(Math.round(w*10)/10).toString().replace(".",",");
function pmLabel(v){return v==null?null:v<=12?["gut","var(--green)"]:v<=35?["mäßig","var(--light)"]:["schlecht","var(--red)"]}
function humLabel(h){return h==null?null:h<40?["trocken","var(--light)"]:h<=60?["ideal","var(--green)"]:["feucht","var(--cool)"]}
function airTile(d){
  const off=d.warn?" off-line":"",can='on' in d,purifier=/levoit|luftrein|purifier/i.test(d.n)||(d.raw&&/purifier/i.test(d.raw.vcls||d.raw.cls||""));
  const zoneHum=humOf(S.devices.filter(x=>x.z===d.z)),hum=d.hum!=null?d.hum:zoneHum;
  let big,label,lab;
  if(purifier){big=d.pm!=null?`${d.pm}<small> µg/m³</small>`:"–";label="Feinstaub PM2,5";lab=pmLabel(d.pm)}
  else{big=hum!=null?`${Math.round(hum)}<small> %</small>`:"–";label=`Luftfeuchte ${esc(shortZone(d.z))}`;lab=humLabel(hum)}
  const extra=[d.w!=null&&d.on?`${fmtW(d.w)} W`:null,d.kwh!=null?`heute ${fE(d.kwh)}`:null].filter(Boolean).join(" · ");
  const inner=`<span class="top"><span class="ico">${devImg(d,"air",46)}</span>${can?`<span class="pw">${PW}</span>`:""}</span>
   <span class="airval"><b class="big">${big}</b><span class="lbl">${label}${lab?` <i style="color:${lab[1]}">● ${lab[0]}</i>`:""}</span></span>
   <span class="txt"><b>${esc(d.n)}</b><small class="${d.warn?"warn":""}">${esc(d.warn||(can?(d.on?"An":"Aus"):shortZone(d.z)))}${extra?" · "+extra:""}</small></span>`;
  return can?`<button class="sw air${d.on?" on":""}${off}" data-tog="${d.id}" aria-pressed="${d.on}">${inner}</button>`:`<div class="sw air${off}">${inner}</div>`;
}
function areaHTML(){
  const a=$("#area");
  if(TAB==="home"){a.className="area home";return homeHTML()}
  if(TAB==="solar"){a.className="area solar";return solarHTML()}
  if(TAB==="heat"){const H=heaters();a.className="area c2";return H.map(heatTile).join("")||'<div class="sub">Keine Heizungen gefunden.</div>'}
  if(TAB==="air"){const A=airs();a.className="area c2";return A.map(airTile).join("")||'<div class="sub">Keine Luftgeräte gefunden.</div>'}
  const list=TAB==="light"?lamps():plugs();a.className="area "+cols(list.length);
  return list.map(d=>swTile(d,TAB)).join("")||'<div class="sub">Keine Geräte gefunden.</div>';
}
function render(){
  $("#rail").innerHTML=railHTML();$("#seg").innerHTML=segHTML();$("#area").innerHTML=areaHTML();
  $("#modal").innerHTML=S.modal==="settings"?settingsModal():"";
}
function tick(){const n=new Date(),t=$("#time"),d=$("#date");if(t)t.textContent=n.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});if(d)d.textContent=n.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  if(store.get("autonight",true)){const hr=n.getHours(),auto=hr>=22||hr<6;if(auto!==S.autoNight){S.autoNight=auto;setNight(auto)}}}
function setNight(on){S.night=on;document.body.classList.toggle("night",on);const b=$("#nightbtn");if(b)b.setAttribute("aria-pressed",on)}

document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-close]");if(!b)return;
  if(b.matches(".scrim")&&e.target!==b)return;
  if(b.dataset.close!==undefined){S.modal=null;render();return}
  if(b.dataset.open){S.modal=b.dataset.open;render();return}
  if(b.dataset.save!==undefined){cfg={addr:$("#f-addr").value.trim(),key:$("#f-key").value.trim(),city:$("#f-city").value.trim()};store.set("cfg",cfg);
    store.set("wake",$("#f-wake").checked);store.set("autonight",$("#f-autonight").checked);store.set("autofull",$("#f-autofull").checked);applyWake();S.modal=null;loadWeather();connect();return}
  if(b.dataset.demo!==undefined){S.err="";loadDemo();S.modal=null;render();toast("Demo-Daten geladen");return}
  if(b.id==="nightbtn"){setNight(!S.night);return}
  if(b.dataset.tab){TAB=b.dataset.tab;render();$("#area").scrollTop=0;return}
  if(b.dataset.temp){const d=dev(b.dataset.temp);if(d)temp(d,+b.dataset.d);return}
  if(b.dataset.tog){const d=dev(b.dataset.tog);if(d)toggle(d);return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.modal){S.modal=null;render()}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){applyWake();if(S.mode!=="demo")connect(true)}});
setInterval(()=>{if(S.mode==="live"&&document.visibilityState==="visible"&&!S.modal)connect(true)},10000);
setInterval(()=>{if(document.visibilityState==="visible")loadWeather()},900000);
setInterval(()=>{if(S.mode==="live"&&document.visibilityState==="visible")loadDaily()},300000);

/* ---------- Vollbild ---------- */
const isStandalone=()=>matchMedia("(display-mode: fullscreen)").matches||matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function goFull(){const el=document.documentElement;if(document.fullscreenElement||isStandalone())return;const f=el.requestFullscreen||el.webkitRequestFullscreen;if(f){try{const r=f.call(el,{navigationUI:"hide"});if(r&&r.catch)r.catch(()=>{})}catch(e){}}}
if(store.get("autofull",true))document.addEventListener("pointerdown",goFull,{passive:true});
if("serviceWorker" in navigator&&location.protocol==="https:"&&!sandboxed){navigator.serviceWorker.register("sw.js").catch(()=>{})}
let idleT;const backHome=()=>{clearTimeout(idleT);idleT=setTimeout(()=>{if(TAB!=="home"&&!S.modal){TAB="home";render()}},120000)};
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,backHome,{passive:true}));
render();tick();setInterval(tick,15000);applyWake();
if(cfg.addr&&cfg.key)connect(true);if(cfg.city)loadWeather();

</script>
